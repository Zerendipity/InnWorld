title: The World We Make
description: Crónica de Esthelm. Personajes, grupos y lugares de la campaña de Innworld, solo con lo que vuestros personajes saben.
footer: The World We Make · Cuaderno de campaña de Innworld.
# Logo de la campaña (ruta dentro de Assets/). Sale en la cabecera de todas las páginas.
logo: Logo/The World We Make - logo.png
logo_alt: The World We Make — The Wandering Inn
# Dirección pública del sitio, para la vista previa al compartir el enlace.
base_url: https://zerendipity.github.io/InnWorld/
# Imagen para las páginas en construcción (wip: true), ruta dentro de Assets/.
wip_image: MrshaUnderConstruction.png
wip_image_alt: "Mrsha, con casco y chaleco de obra y un martillo, junto a un cartel que dice: Página en construcción."
through_session: 9
# Secciones que no se publican (no salen en el menú ni en la portada).
# Quita 'cronica' de esta lista cuando la hayas revisado.
hidden: [cronica]
headline: Esthelm sigue en pie.
lead: La ciudad sobrevivió al asedio, pero dos de cada tres edificios siguen en ruinas. Aquí está todo lo que sabéis de la gente, los grupos y los sitios que os rodean.
# Cartas del abanico de la portada: al azar entre todos los personajes con carta.
# hero_cards solo se usa si el navegador no ejecuta JavaScript.
hero_random: true
hero_cards: [magnolia-reinhart, vessa-galesinger, erin-solstice, frasi, klbkch]
leads_intro: Lo que tenéis entre manos ahora mismo.
doors:
  personajes: Quién es quién, con lo que sabéis de cada uno.
  grupos: Gremios, facciones y bandos.
  lugares: Esthelm, Liscor, Celum y vuestra casa.
  cronica: Lo que ha pasado, sesión a sesión.
  biblioteca: Libros sobre el mundo de Innworld, con texto y audio.
leads:
  - title: La granja a las afueras
    text: Un registro nuevo de la Guardia dice que hay suministros guardados en una granja fuera de Esthelm, y los propios guardias lo encontraron raro. Terminasteis la última sesión de camino a investigarla.
    related: [grupos/guardia-de-esthelm, personajes/vessa-galesinger]
  - title: Los falsos ataques goblin
    text: Tenéis pruebas de que al menos parte de los ataques «goblin» a las caravanas los cometen bandidos humanos, y de que eligen caravanas sin escolta. Tres de ellos están presos en Celum. No sabéis quién les pasa la información. Además, Charley ha visto que las cuentas del Gremio de Mercaderes no cuadran.
    related: [grupos/gremio-de-mercaderes, personajes/orsten, personajes/elias-maren]
  - title: Redhat
    text: El joven goblin del sombrero rojo se marchó con comida y agua después de que Amaia lo dejara ir. Nadie sabe adónde fue ni si volverá a acercarse.
    related: [personajes/redhat]
  - title: Cristales de canción
    text: Telisa pagará la importación de cristales de Wistram para que Sonia grabe canciones, y se quedará con parte de los beneficios. Aún no hay cantidades ni plazos cerrados, y no ha llegado ningún envío.
    related: [personajes/telisa, grupos/bardos-de-esthelm]
  - title: La clave con BlackMage
    text: Charley y BlackMage, en Wistram, quieren montar un cifrado sencillo con un número primo y claves pública y privada. De momento es solo un acuerdo; no hay algoritmo ni mensajes cifrados.
    related: [personajes/telisa]
